<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>DreamCode</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242426;background:#fff}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}.app{display:grid;grid-template-columns:252px 1fr;height:100vh}.sidebar{background:#f3f3f3;border-right:1px solid #dedede;padding:18px 14px;display:flex;flex-direction:column;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}.brand img{width:28px;height:28px;background:#000;border-radius:7px;padding:3px}.new{border:0;background:#fff;border-radius:10px;padding:11px 13px;text-align:left;font-size:14px;box-shadow:0 1px 2px #0000000b;cursor:pointer}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:transparent;padding:10px 12px;border-radius:9px;text-align:left;font-size:14px;color:#555;cursor:pointer}.nav button.active,.nav button:hover{background:#e7e7e8;color:#222}.sidebar .muted{margin-top:auto;color:#8a8a8d;font-size:12px}.main{display:flex;flex-direction:column;min-width:0}.top{height:58px;border-bottom:1px solid #dedede;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.title{font-weight:600}.top-actions{display:flex;gap:8px}.icon{border:0;background:transparent;border-radius:8px;padding:8px 10px;color:#666;cursor:pointer}.icon:hover{background:#f2f2f3}.content{flex:1;min-height:0;display:flex}.conversation{flex:1;overflow:auto;padding:34px 8vw 120px}.message{max-width:820px;margin:0 auto 26px}.user{display:flex;justify-content:flex-end}.bubble{background:#f2f2f3;border-radius:18px;padding:12px 16px;max-width:75%;white-space:pre-wrap}.agent{font-size:15px;line-height:1.65}.agent h3{margin:0 0 8px;font-size:16px}.agent code{background:#f4f4f5;border-radius:5px;padding:2px 5px}.agent pre{background:#1e1e22;color:#f5f5f5;border-radius:10px;padding:14px;overflow:auto}.composer{position:fixed;left:calc(252px + 8vw);right:8vw;bottom:24px;background:#fff;border:1px solid #d9d9dc;border-radius:16px;box-shadow:0 8px 28px #00000012;padding:10px;display:flex;gap:8px}.composer textarea{flex:1;border:0;resize:none;outline:0;font:inherit;min-height:42px}.send{border:0;background:#242426;color:#fff;border-radius:10px;padding:0 16px;cursor:pointer}.panel{width:360px;border-left:1px solid #dedede;padding:22px;overflow:auto;background:#fff}.panel h2{font-size:17px;margin:0 0 18px}.tabs{display:flex;border-bottom:1px solid #e5e5e5;margin-bottom:14px}.tabs button{border:0;background:transparent;padding:9px 12px;color:#777;cursor:pointer}.tabs button.active{color:#222;border-bottom:2px solid #222}.log{font:12px ui-monospace,monospace;white-space:pre-wrap;color:#4c4c50}.log-row{padding:7px 0;border-bottom:1px solid #f0f0f0}.log-time{color:#999;margin-right:8px}.settings{max-width:880px;margin:0 auto;padding:44px 32px;overflow:auto}.settings h1{font-size:28px;margin:0 0 8px}.settings p{color:#777;margin:0 0 32px}.setting-group{border:1px solid #e5e5e5;border-radius:16px;overflow:hidden;margin-bottom:24px}.setting-row{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #ededed}.setting-row:last-child{border-bottom:0}.setting-row strong{display:block;font-size:14px}.setting-row span{display:block;color:#888;font-size:12px;margin-top:5px}.select{border:1px solid #e4e4e6;background:#fff;border-radius:10px;padding:9px 12px;min-width:210px}.hidden{display:none}@media(max-width:1100px){.panel{width:300px}.conversation{padding-left:5vw;padding-right:5vw}.composer{left:calc(252px + 5vw);right:5vw}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><img src="../../docs/assets/dreamcode-logo.svg"><span>DreamCode</span></div><button class="new" id="newTask">＋ 新建任务</button><nav class="nav"><button class="active" data-view="chat">⌁ 对话</button><button data-view="settings">⚙ 设置</button></nav><div class="muted">本机 Agent 工作区</div></aside><main class="main"><header class="top"><div class="title" id="pageTitle">新任务</div><div class="top-actions"><button class="icon" data-panel="terminal">▣ 终端</button><button class="icon" data-panel="logs">☷ Agent 日志</button></div></header><section class="content"><div class="conversation" id="chatView"><div class="message agent"><h3>欢迎使用 DreamCode</h3><div>描述你希望 Agent 完成的任务。输出支持 <code>Markdown</code>、代码块和文件变更摘要。</div></div></div><div class="settings hidden" id="settingsView"><h1>配置</h1><p>管理模型、运行权限和本机 Agent 行为。</p><div class="setting-group"><div class="setting-row"><div><strong>模型供应商</strong><span>选择 OpenAI-compatible provider</span></div><select class="select" id="provider"></select></div><div class="setting-row"><div><strong>模型</strong><span>选择当前 Agent 使用的模型</span></div><select class="select" id="model"></select></div><div class="setting-row"><div><strong>API Key</strong><span>仅保存在本机配置中</span></div><input class="select" type="password" placeholder="sk-..." /></div><div class="setting-row"><div><strong>运行模式</strong><span>控制工具调用的确认策略</span></div><select class="select"><option>guided</option><option>plan</option><option>yolo</option><option>full</option></select></div></div></div><aside class="panel hidden" id="panel"><h2 id="panelTitle">Agent 日志</h2><div class="tabs"><button class="active" data-panel-tab="logs">日志</button><button data-panel-tab="terminal">终端</button></div><div id="panelBody" class="log"></div></aside></section><div class="composer" id="composer"><textarea id="prompt" placeholder="告诉 DreamCode 你想完成什么…"></textarea><button class="send" id="send">发送</button></div></main></div><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)]; const state={providers:[],logs:[],panel:'logs'};
function renderLogs(){ $('#panelBody').innerHTML=state.logs.map(x=>`<div class="log-row"><span class="log-time">${new Date(x.time).toLocaleTimeString()}</span><b>${x.type}</b> ${x.text}</div>`).join('')||'暂无日志'; $('#panelBody').scrollTop=999999; }
function showPanel(kind){state.panel=kind;$('#panel').classList.remove('hidden');$('#panelTitle').textContent=kind==='logs'?'Agent 日志':'终端';renderLogs();}
function updateModels(){const p=state.providers.find(x=>x.id===$('#provider').value);$('#model').innerHTML=(p?.models||[{id:p?.defaultModel||''}]).map(m=>`<option value="${m.id}">${m.label||m.id}</option>`).join('');}
$$('[data-view]').forEach(b=>b.onclick=()=>{ $$('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active'); const settings=b.dataset.view==='settings';$('#chatView').classList.toggle('hidden',settings);$('#settingsView').classList.toggle('hidden',!settings);$('#composer').classList.toggle('hidden',settings);$('#pageTitle').textContent=settings?'配置':'新任务'; });
$$('[data-panel]').forEach(b=>b.onclick=()=>showPanel(b.dataset.panel)); $$('[data-panel-tab]').forEach(b=>b.onclick=()=>showPanel(b.dataset.panelTab)); $('#provider').onchange=updateModels;
$('#send').onclick=async()=>{const p=$('#prompt').value.trim();if(!p)return;$('#prompt').value='';$('#chatView').insertAdjacentHTML('beforeend',`<div class="message user"><div class="bubble">${p.replaceAll('<','&lt;')}</div></div><div class="message agent"><div>正在执行…</div></div>`);await window.dreamcode.runDemo(p);}; $('#newTask').onclick=()=>location.reload();
window.dreamcode.onLog(x=>{state.logs.push(x);if(state.panel==='logs')renderLogs();}); window.dreamcode.getProviders().then(ps=>{state.providers=ps;$('#provider').innerHTML=ps.map(p=>`<option value="${p.id}">${p.displayName}</option>`).join('');updateModels();}); window.dreamcode.getLogs().then(x=>{state.logs=x;renderLogs();});
</script></body></html>
