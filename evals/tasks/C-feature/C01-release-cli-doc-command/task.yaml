id: C01-release-cli-doc-command
fixture: release-cli
prompt: "根据 release CLI 的真实实现补全 README 中 validate 和 summary 的可执行用法、manifest 参数和输出示例。只修改 README，完成后运行测试。"
mode: yolo
fakeScenario: release-readme
budgets: { referenceLatencyMs: 120000, referenceTokens: 18000, referenceToolCalls: 14 }
assertions:
  - type: file-matches
    path: README.md
    pattern: "(?:release|src/cli\\.ts)\\s+validate"
  - type: file-matches
    path: README.md
    pattern: "(?:release|src/cli\\.ts)\\s+summary"
  - type: file-unchanged
    path: src/cli.ts
  - type: command
    command: npm test
    expectedExitCode: 0
